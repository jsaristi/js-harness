# The gate on CircleCI, for the merge queue's candidates only (odd/tasks/merge-queue.md): `node bin/check.mjs`
# on Linux, the whole suite. A candidate branch (`queue/*`) is main with the ready pull requests merged into
# it, so this run tests the main it would become. No GitHub workflow runs for a pull request: the one there is,
# .github/workflows/gate.yml, runs a commit's gate for a push to a `gate/` branch alone (held by
# scripts/github-workflows.test.mjs).
#
# The free plan has 30,000 credits a month and no payment method; a medium Docker job is 10 credits a minute.
# What bounds a run is in this file and is held by scripts/circleci-config.test.mjs: one job, an exact image,
# medium, no parallelism, no secret, and no run for any branch but `queue/*`, so that no status of it lands
# on another pull request and moves its merge state off CLEAN.
version: 2.1

jobs:
  check:
    docker:
      # An exact tag, published 2026-09-09: a moving tag would change the runner under the same config.
      - image: cimg/node:24.21.0
    resource_class: medium
    steps:
      - checkout
      # `check` compares the head with the default branch, which a checkout of one branch may not hold.
      - run:
          name: The default branch
          command: git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
      - run:
          name: What the runner is
          command: node -e "const os = require('node:os'); console.log(process.version, os.platform(), os.release(), os.availableParallelism() + ' logical processors', Math.round(os.totalmem() / 2 ** 30) + ' GB')"
      - run:
          name: The gate
          # Two test files at a time, as the GitHub run had them: node's default is one fewer than the
          # processors the container reports, which a Docker executor may count as its host's, and medium is
          # 2 vCPUs (unmeasured here: "What the runner is" prints the count). node takes no
          # --test-concurrency in NODE_OPTIONS, so check adds it.
          environment:
            JS_HARNESS_TEST_CONCURRENCY: 2
          command: node bin/check.mjs
          no_output_timeout: 15m

workflows:
  gate:
    jobs:
      - check:
          filters:
            branches:
              only: /^queue\/.*/
