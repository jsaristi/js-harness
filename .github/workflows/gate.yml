# The gate of one commit on GitHub's machines, for a commit whose tests would wait for this machine's line
# (odd/tasks/first-version.md, "Gates on CI machines"). `check` pushes the tree it is about to commit to
# `gate/<sha>`, reads this run's conclusion, and deletes the branch; the commit is made only on green.
#
# It runs for nothing but a push to a `gate/` branch: no pull request starts a run, and a fork can push none
# here. The token reads and nothing more, no secret is named, and every action is pinned by commit. All of it
# is held by scripts/github-workflows.test.mjs. The repository is public, so its runs cost no minutes.
name: gate

on:
  push:
    branches:
      - 'gate/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # v4.2.2. The whole history: `check` compares the head with origin/main.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      # v4.4.0, with the node the CircleCI image runs (cimg/node:24.21.0).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: What the runner is
        run: node -e "const os = require('node:os'); console.log(process.version, os.platform(), os.release(), os.availableParallelism() + ' logical processors', Math.round(os.totalmem() / 2 ** 30) + ' GB')"
      - name: The gate
        run: node bin/check.mjs
